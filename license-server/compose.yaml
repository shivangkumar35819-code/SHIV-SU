services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
      BIND_HOST: "0.0.0.0"
    volumes:
      - licenses:/app/data
    # No public API port; requests must pass through HTTPS Caddy.
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      LOGIN_DOMAIN: ${LOGIN_DOMAIN:?Configure LOGIN_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  licenses:
  caddy_data:
  caddy_config:
